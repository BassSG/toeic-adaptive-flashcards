<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TOEIC Adaptive Flashcards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="Learning controls">
        <div>
          <p class="eyebrow">Oxford 3000 PDF</p>
          <h1>TOEIC Adaptive Flashcards</h1>
        </div>
        <div class="mode-actions">
          <button class="ghost-button" id="reviewButton" type="button">Review</button>
          <button class="ghost-button" id="savedReviewButton" type="button">Saved</button>
          <button class="ghost-button danger" id="resetButton" type="button">Reset</button>
        </div>
      </section>

      <section class="level-bar" aria-label="CEFR level selector" id="levelSelector"></section>

      <section class="content-grid">
        <article class="quiz-panel">
          <div class="quiz-meta">
            <span id="modePill">Adaptive</span>
            <button id="saveButton" class="icon-button" type="button" aria-label="Save word">☆</button>
          </div>

          <div class="word-stage">
            <p class="word-pos" id="wordPos">Ready</p>
            <h2 id="wordText">เริ่มเรียน</h2>
          </div>

          <div class="answer-grid" id="answerGrid"></div>

          <div class="feedback-row">
            <p id="feedbackText" aria-live="polite">เลือกคำตอบที่ถูกต้อง</p>
            <button id="nextButton" type="button" disabled>Next</button>
          </div>
        </article>

        <aside class="dashboard-panel">
          <div class="stat-grid">
            <div class="stat-card">
              <span>Score</span>
              <strong id="scoreValue">0</strong>
            </div>
            <div class="stat-card">
              <span>Accuracy</span>
              <strong id="accuracyValue">0%</strong>
            </div>
            <div class="stat-card">
              <span>Level</span>
              <strong id="levelValue">A1</strong>
            </div>
            <div class="stat-card">
              <span>Learned</span>
              <strong id="learnedValue">0</strong>
            </div>
          </div>

          <div class="meter-block">
            <div class="meter-label">
              <span>Level Accuracy</span>
              <strong id="levelAccuracyValue">0%</strong>
            </div>
            <div class="meter-track">
              <div id="levelAccuracyMeter"></div>
            </div>
          </div>

          <div class="list-block">
            <div class="list-heading">
              <h3>Weak Words</h3>
              <span id="weakCount">0</span>
            </div>
            <ol id="weakWordsList"></ol>
          </div>

          <div class="list-block">
            <div class="list-heading">
              <h3>Saved Words</h3>
              <span id="savedCount">0</span>
            </div>
            <ol id="savedWordsList"></ol>
          </div>
        </aside>
      </section>
    </main>

    <script src="data/vocab.js"></script>
    <script src="app.js"></script>
  </body>
</html>
